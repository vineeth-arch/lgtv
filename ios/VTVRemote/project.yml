name: VTVRemote
options:
  bundleIdPrefix: com.designinnsaeit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Passed on the xcodebuild command line in CI (APPLE_TEAM_ID repo variable); set it in your shell for local builds.
    APPLE_TEAM_ID: ""
packages:
  VTVCore:
    path: ../VTVCore
targets:
  VTVRemote:
    type: application
    platform: iOS
    sources:
      - path: VTVRemote
    dependencies:
      - package: VTVCore
    info:
      path: VTVRemote/Info.plist
      properties:
        CFBundleDisplayName: "V/TV Remote"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: "V/TV Remote talks to your LG TV on your home network to set its sleep timer."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designinnsaeit.vtvremote
        PRODUCT_NAME: VTVRemote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
        ENABLE_PREVIEWS: NO
