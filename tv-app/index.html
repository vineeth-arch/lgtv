<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>V/TV Sleep</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="screen">
    <header class="brand">V/TV SLEEP</header>

    <section id="presets" class="row" aria-label="Sleep timer length">
      <button class="tile" data-nav="0,0" data-min="30"><span class="num">30</span><span class="unit">MIN</span></button>
      <button class="tile" data-nav="0,1" data-min="45"><span class="num">45</span><span class="unit">MIN</span></button>
      <button class="tile" data-nav="0,2" data-min="60"><span class="num">60</span><span class="unit">MIN</span></button>
      <button class="tile" data-nav="0,3" data-min="90"><span class="num">90</span><span class="unit">MIN</span></button>
      <button class="tile tile-custom" id="b-custom" data-nav="0,4"><span class="word">CUSTOM</span></button>
    </section>

    <section id="custom" class="row" hidden aria-label="Custom minutes">
      <button class="tile step" id="b-minus" data-nav="0,0" aria-label="Minus 5 minutes">&minus;</button>
      <div class="readout"><span class="num" id="custom-val">45</span><span class="unit">MIN</span></div>
      <button class="tile step" id="b-plus" data-nav="0,1" aria-label="Plus 5 minutes">+</button>
      <button class="tile tile-set" id="b-set" data-nav="0,2">SET</button>
    </section>

    <section class="status" aria-live="polite">
      <div class="label">TIMER STATUS</div>
      <div id="st-main" class="st-main none">No timer set</div>
      <div id="st-sub" class="st-sub" hidden></div>
    </section>

    <button id="b-cancel" class="cancel" data-nav="1,0" disabled>CANCEL TIMER</button>
  </main>

  <div id="overlay" hidden>
    <div id="ov-inner">
      <svg id="ov-check" width="140" height="140" viewBox="0 0 140 140" aria-hidden="true">
        <circle cx="70" cy="70" r="64" fill="none" stroke="currentColor" stroke-width="8"/>
        <path d="M40 72 L61 93 L101 49" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div id="ov-title"></div>
      <div id="ov-sub"></div>
    </div>
  </div>

  <div id="dev" hidden>
    <div class="dev-col">
      <div class="dev-title">DEVELOPER</div>
      <button class="dev-btn" id="d-test2" data-nav="0,0">TEST 2 MIN</button>
      <button class="dev-btn" id="d-off" data-nav="1,0">TEST POWER OFF</button>
      <button class="dev-btn" id="d-am" data-nav="2,0">TEST ACTIVITY MANAGER</button>
      <button class="dev-btn" id="d-pair" data-nav="3,0">PAIR LOCAL</button>
      <button class="dev-btn" id="d-diag" data-nav="4,0">DIAGNOSTICS</button>
    </div>
    <pre id="out" tabindex="0" data-nav="2,1">Ready.</pre>
  </div>

  <script src="bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
